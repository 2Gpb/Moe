[project]
name = "finmoe"
version = "0.1.0"
description = "Parameter-efficient domain adaptation of Mixture-of-Experts language models for financial NLP"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.6",
    "transformers>=5.0",
    "datasets>=3.0",
    "accelerate>=1.0",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finmoe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
